version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      outillage-dev:
        dependency-type: development
    open-pull-requests-limit: 5
    ignore:
      # Les types Node suivent la version de Node utilisée (.nvmrc), pas la dernière publiée.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
